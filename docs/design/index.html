(circle at 18% 28%, #F97316 0, transparent 38%), radial-gradient(circle at 46% 12%, #EC4899 0, transparent 30%), radial-gradient(circle at 76% 22%, #8B5CF6 0, transparent 42%), radial-gradient(circle at 60% 82%, #06B6D4 0, transparent 44%), #1E1B4B', avg: [78, 62, 120] },\n      koyu: { bg: 'linear-gradient(160deg, #0F172A, #111827 60%, #1F2937)', avg: [24, 30, 44] },\n      acik: { bg: 'radial-gradient(circle at 30% 20%, #FDE68A 0, transparent 45%), radial-gradient(circle at 80% 70%, #BFDBFE 0, transparent 50%), #F1F5F9', avg: [236, 240, 246] },\n      foto: { bg: 'linear-gradient(180deg, rgba(255,214,170,0.9) 0%, rgba(255,150,110,0.55) 26%, rgba(60,80,130,0) 52%), radial-gradient(ellipse at 18% 108%, #1F2A37 0 34%, transparent 35%), radial-gradient(ellipse at 72% 112%, #2B3544 0 42%, transparent 43%), linear-gradient(180deg, #5B7DB1, #3C5A86 60%, #20344F)', avg: [104, 116, 142] }\n    };\n    const wall = walls[s.wall];\n    const alphas = { kati: 1, buzlu: 0.86, cam: 0.72 };\n\n    // Okunabilirlik: ikincil metin (%62 beyaz) etkin yüzeyde 4,5:1 altına inmesin. Cam yetmezse Buzlu, o da yetmezse Katı.\n    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };\n    const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);\n    const ratio = (x, y) => { const a1 = lum(x), b1 = lum(y); return (Math.max(a1, b1) + 0.05) / (Math.min(a1, b1) + 0.05); };\n    const base = [10, 10, 11], white = [244, 244, 245];\n    const blend = (top, bottom, t) => top.map((v, i) => v * t + bottom[i] * (1 - t));\n    const contrastAt = (al) => {\n      const surfRgb = blend(base, wall.avg, al);\n      return { c1: ratio(white, surfRgb), c2: ratio(blend(white, surfRgb, 0.62), surfRgb) };\n    };\n    const order = ['cam', 'buzlu', 'kati'];\n    let level = s.level;\n    let protectedNow = false;\n    if (s.protect) {\n      for (const lv of order.slice(order.indexOf(level))) {\n        level = lv;\n        if (contrastAt(alphas[lv]).c2 >= 4.5) break;\n      }\n      protectedNow = level !== s.level;\n    }\n    const a = alphas[level];\n    const solid = level === 'kati';\n    const cx = contrastAt(a);\n    const fmt = (n) => n.toFixed(1).replace('.', ',') + ':1';\n\n    // Renkler CSS değişkeni: değerler koda birebir geçer.\n    const tokens = [\n      '--notch-closed: #0A0A0B',\n      '--surface-solid: rgb(10,10,11)',\n      '--surface-frosted: rgba(10,10,11,0.86)',\n      '--surface-glass: rgba(10,10,11,0.72)',\n      '--surface: ' + (solid ? 'rgb(10,10,11)' : 'rgba(10,10,11,' + a + ')'),\n      '--edge: ' + (solid ? 'transparent' : 'rgba(255,255,255,0.10)'),\n      '--card: ' + (solid ? 'rgba(255,255,255,0.045)' : 'rgba(255,255,255,0.06)'),\n      '--card-hi: rgba(255,255,255,0.09)',\n      '--line: ' + (solid ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.08)'),\n      '--text-1: #F4F4F5',\n      '--text-2: rgba(244,244,245,0.62)',\n      '--text-3: rgba(244,244,245,0.40)',\n      '--track: rgba(255,255,255,0.16)',\n      '--btn-bg: #F4F4F5',\n      '--focus: #FB7185'\n    ].join('; ') + ';';\n\n    const defs = [\n      ['ana', 'Ana', '#F4F4F5', 'M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],\n      ['odak', 'Odak', '#FB7185', 'M12 8v5l3 2M9 2h6M12 22a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'],\n      ['takvim', 'Takvim', '#38BDF8', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],\n      ['raf', 'Raf', '#FBBF24', 'M21 8l-9-5-9 5 9 5zM3 8v8l9 5 9-5V8'],\n      ['pano', 'Pano', '#A78BFA', 'M9 3h6v4H9zM16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2M8 12h8M8 16h5'],\n      ['sistem', 'Sistem', '#34D399', 'M3 12h4l3-8 4 16 3-8h4'],\n      ['kontrol', 'Kontrol', '#3B82F6', 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M8 10v4M18 16v4']\n    ];\n    const tabs = defs.map(([id, label, c, d]) => ({\n      label, d,\n      ic: s.tab === id ? c : 'rgba(244,244,245,0.45)',\n      bg: s.tab === id ? 'rgba(255,255,255,0.09)' : 'transparent',\n      fg: s.tab === id ? '#F4F4F5' : 'rgba(244,244,245,0.55)',\n      pick: () => this.setState({ tab: id })\n    }));\n\n    const ev = [3, 6, 11, 14, 19, 24, 27];\n    const days = [];\n    for (let i = 0; i < 35; i++) {\n      const n = i - 5;\n      const inMonth = n >= 1 && n <= 30;\n      const today = n === 6;\n      days.push({\n        n: inMonth ? n : '',\n        bg: today ? '#F4F4F5' : 'transparent',\n        fg: today ? '#0A0A0B' : '#F4F4F5',\n        w: today ? 700 : 400,\n        dot: inMonth && ev.includes(n) && !today ? '#38BDF8' : 'transparent'\n      });\n    }\n\n    const seg = (key, label, opts) => ({\n      l: label,\n      opts: opts.map(([v, l]) => ({\n        l,\n        bg: s[key] === v ? '#F4F4F5' : 'transparent',\n        fg: s[key] === v ? '#0A0A0B' : '#D4D4D8',\n        pick: () => this.setState({ [key]: v })\n      }))\n    });\n\n    const card = 'var(--card)', line = 'var(--line)';\n    const levelNames = { kati: 'Katı (opak)', buzlu: 'Buzlu (%86)', cam: 'Cam (%72)' };\n    const reqNames = { kati: 'Katı', buzlu: 'Buzlu', cam: 'Cam' };\n    return {\n      tokens,\n      wallBg: wall.bg,\n      cardAlpha: a,\n      mstyle: s.mstyle,\n      cover: s.cover,\n      ringHole: solid ? '#141416' : 'rgba(20,20,22,0.92)',\n      surfLabel: levelNames[level],\n      contrastLabel: 'beyaz metin ' + fmt(cx.c1) + ' · ikincil ' + fmt(cx.c2),\n      protectMsg: 'Okunabilirlik koruması: bu duvar kağıdında ' + reqNames[s.level] + ' ikincil metni 4,5:1 altına indiriyor, ' + reqNames[level] + \"'a çıkarıldı\",\n      protected: protectedNow,\n      tabs,\n      tAna: s.tab === 'ana', tOdak: s.tab === 'odak', tTakvim: s.tab === 'takvim', tRaf: s.tab === 'raf',\n      tPano: s.tab === 'pano', tSistem: s.tab === 'sistem', tKontrol: s.tab === 'kontrol',\n      playing: s.playing, idle: !s.playing,\n      apps: [{ l: 'Ge', c: '#FCD34D' }, { l: 'Ta', c: '#93C5FD' }, { l: 'Ko', c: '#C4B5FD' }, { l: 'Te', c: '#6EE7B7' }, { l: 'Ay', c: '#E4E4E7' }],\n      days,\n      events: [\n        { t: 'Ekip görüşmesi', h: '10:00 - 10:30', c: '#38BDF8' },\n        { t: 'Öğle yemeği · Ayşe', h: '12:30', c: 'rgba(255,255,255,0.35)' },\n        { t: 'Sunum provası', h: '16:00 - 17:00', c: 'rgba(255,255,255,0.35)' }\n      ],\n      files: [\n        { n: 'sunum.pdf', e: 'PDF', c: '#FCA5A5', s: '2,1 MB' },\n        { n: 'ekran.png', e: 'PNG', c: '#93C5FD', s: '840 KB' },\n        { n: 'notlar.md', e: 'MD', c: '#E4E4E7', s: '23 KB' }\n      ],\n      chips: ['Tümü', 'Sabit', 'Bağlantı', 'Renk', 'Kod'].map((l, i) => ({ l, bg: i === 0 ? 'rgba(255,255,255,0.14)' : 'transparent', fg: i === 0 ? '#F4F4F5' : 'rgba(244,244,245,0.6)' })),\n      clips: [\n        { m: 'Bağlantı · 2 dk', t: 'github.com/koyhq/koy', f: 'inherit', sw: '0', sc: 'transparent' },\n        { m: 'Renk · sabit', t: '#3B82F6', f: 'inherit', sw: '18px', sc: '#3B82F6' },\n        { m: 'Kod · 12 dk', t: 'dotnet build Koy.slnx', f: 'Consolas, monospace', sw: '0', sc: 'transparent' },\n        { m: 'Metin · 25 dk', t: 'Toplantı 16:00’ya alındı', f: 'inherit', sw: '0', sc: 'transparent' },\n        { m: 'Renk · 1 sa', t: '#FB7185', f: 'inherit', sw: '18px', sc: '#FB7185' },\n        { m: 'Metin · 2 sa', t: 'Adres: Kadıköy, İstanbul', f: 'inherit', sw: '0', sc: 'transparent' }\n      ],\n      rings: [\n        { v: '%23', l: 'İşlemci', s: 'En çok: Chrome', deg: '83deg' },\n        { v: '%58', l: 'Bellek', s: '9,2 / 16 GB', deg: '209deg' }\n      ],\n      tiles: [\n        { t: 'Wi-Fi', s: 'Ev Ağı', arrow: true, bg: '#3B82F6', bd: 'transparent', fg: '#FFFFFF', ib: 'rgba(255,255,255,0.20)', d: 'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01' },\n        { t: 'Bluetooth', s: 'Açık', arrow: true, bg: '#3B82F6', bd: 'transparent', fg: '#FFFFFF', ib: 'rgba(255,255,255,0.20)', d: 'M7 7l10 10-5 5V2l5 5L7 17' },\n        { t: 'Rahatsız Etme', s: 'Kapalı', arrow: false, bg: card, bd: line, fg: '#F4F4F5', ib: 'rgba(255,25 'a götür<\/button>\n      <span>{{progLabel}}<\/span>\n    <\/div>\n    <div style=\"height: 392px; border-radius: 12px; background: {{wall}}; display: flex; justify-content: center; align-items: flex-start; overflow: hidden;\">\n      <div style=\"position: relative; margin-top: {{tr.top}}px; width: {{tr.w}}px; height: {{tr.h}}px; background: {{tr.bg}}; border: 1px solid {{tr.bd}}; border-top: {{tr.bt}}; border-radius: {{tr.rad}}; box-sizing: border-box; overflow: hidden; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"opacity: {{tr.inner}}; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"height: 26px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 0 4px;\"><span><b style=\"font-weight: 600;\">14:36<\/b><span style=\"color: var(--text-2);\"> · Perşembe, 6 Kasım<\/span><\/span><span style=\"color: var(--text-2);\">14° İstanbul · %86<\/span><\/div>\n          <div style=\"height: 200px; display: flex; gap: 8px;\">\n            <div style=\"width: 268px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);\"><\/div>\n            <div style=\"flex-grow: 1; border-radius: 16px; background: var(--card); border: 1px solid var(--line);\"><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <span style=\"font-size: 11.5px; color: #A1A1AA; line-height: 1.5;\">Dolgunun opaklığı şeklin boyutuyla birlikte yaydan okunur (ek animasyon saati yok): ilerleme 0'da opak #0A0A0B, 1'de seçili malzeme (şu an {{matName}}); içerik ilerleme 0,55'ten sonra belirir. Kapanırken tersi. Hareket kapalıysa (\"Kapalı\" hız ya da Windows \"animasyonları azalt\") doğrudan son değer atanır: yukarıdaki \"Hareket: Azalt\" ile dene, düğmeler yaysız atlar.<\/span>\n  <\/div>\n\n  <!-- F. Koda geçecek değerler -->\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <span style=\"font-size: 14px; font-weight: 600;\">Koda geçecek değerler<\/span>\n    <span style=\"font-size: 12px; color: #A1A1AA; margin-top: -4px;\">Bu demodaki bütün renkler ve ölçüler aşağıdaki CSS değişkenlerinden okunur. P4B bunları Theme.*.xaml / Tokens.xaml fırçalarına birebir geçirir.<\/span>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 18px;\">\n      <sc-for list=\"{{tokenRows}}\" as=\"t\">\n        <div style=\"display: flex; align-items: center; gap: 10px; font-size: 11.5px; min-height: 24px;\">\n          <span style=\"width: 22px; height: 16px; border-radius: 4px; background: {{t.sw}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); flex-shrink: 0;\"><\/span>\n          <span style=\"font-family: Consolas, monospace; color: #E4E4E7; min-width: 138px;\">{{t.n}}<\/span>\n          <span style=\"font-family: Consolas, monospace; color: #A1A1AA;\">{{t.v}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1240,\"height\":2860}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { mat: 'cam', wall: 'renkli', protect: true, style: 'yapisik', motion: 'normal', p: 0 };\n    this._raf = null;\n    this._v = 0;\n  }\n\n  // Yay: sertlik 220, sönüm 22 (hafif aşım). \"Azalt\" açıksa doğrudan son değer.\n  go(target) {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    this._v = 0;\n    if (this.state.motion === 'azalt') { this.setState({ p: target }); return; }\n    let last = performance.now();\n    const step = (now) => {\n      const dt = Math.min(0.032, (now - last) / 1000);\n      last = now;\n      let x = this.state.p;\n      this._v += (-220 * (x - target) - 22 * this._v) * dt;\n      x += this._v * dt;\n      if (Math.abs(x - target) < 0.002 && Math.abs(this._v) < 0.02) { this._raf = null; this.setState({ p: target }); return; }\n      this.setState({ p: x });\n      this._raf = requestAnimationFrame(step);\n    };\n    this._raf = requestAnimationFrame(step);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const fl = s.style === 'yuzen';\n    const walls = {\n      renkli: { bg: 'radial-gradient(circle at 18% 40%, #F97316 0, transparent 40%), radial-gradient(circle at 70% 30%, #8B5CF6 0, transparent 45%), radial-gradient(circle at 50% 120%, #06B6D4 0, transparent 50%), #1E1B4B', avg: [78, 62, 120] },\n      koyu: { bg: 'linear-gradient(160deg, #0F172A, #111827 60%, #1F2937)', avg: [24, 30, 44] },\n      acik: { bg: 'radial-gradient(circle at 30% 20%, #FDE68A 0, transparent 45%), radial-gradient(circle at 80% 70%, #BFDBFE 0, transparent 50%), #F1F5F9', avg: [236, 240, 246] },\n      foto: { bg: 'linear-gradient(180deg, rgba(255,214,170,0.9) 0%, rgba(255,150,110,0.55) 26%, rgba(60,80,130,0) 52%), radial-gradient(ellipse at 18% 108%, #1F2A37 0 34%, transparent 35%), radial-gradient(ellipse at 72% 112%, #2B3544 0 42%, transparent 43%), linear-gradient(180deg, #5B7DB1, #3C5A86 60%, #20344F)', avg: [104, 116, 142] }\n    };\n    const wall = walls[s.wall];\n    const alphas = { kati: 1, buzlu: 0.86, cam: 0.72 };\n    const names = { kati: 'Katı', buzlu: 'Buzlu %86', cam: 'Cam %72' };\n    const short = { kati: 'Katı', buzlu: 'Buzlu', cam: 'Cam' };\n    const surfVar = { kati: 'var(--surface-solid)', buzlu: 'var(--surface-frosted)', cam: 'var(--surface-glass)' };\n\n    // Okunabilirlik: ikincil metin (%62 beyaz) 4,5:1 altına inmesin. Cam yetmezse Buzlu, o da yetmezse Katı.\n    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };\n    const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);\n    const ratio = (x, y) => { const a1 = lum(x), b1 = lum(y); return (Math.max(a1, b1) + 0.05) / (Math.min(a1, b1) + 0.05); };\n    const base = [10, 10, 11], white = [244, 244, 245];\n    const blend = (top, bottom, t) => top.map((v, i) => v * t + bottom[i] * (1 - t));\n    const contrastAt = (al) => {\n      const surfRgb = blend(base, wall.avg, al);\n      return { c1: ratio(white, surfRgb), c2: ratio(blend(white, surfRgb, 0.62), surfRgb) };\n    };\n    const fmt = (n) => n.toFixed(1).replace('.', ',') + ':1';\n    const order = ['cam', 'buzlu', 'kati'];\n    const effective = (req) => {\n      if (!s.protect) return req;\n      for (const lv of order.slice(order.indexOf(req))) { if (contrastAt(alphas[lv]).c2 >= 4.5) return lv; }\n      return 'kati';\n    };\n\n    const matEff = effective(s.mat);\n    const a = alphas[matEff];\n    const solid = matEff === 'kati';\n    const surface = solid ? 'rgb(10,10,11)' : 'rgba(10,10,11,' + a + ')';\n    const edge = solid ? 'transparent' : 'rgba(255,255,255,0.10)';\n    const tokenList = [\n      ['--notch-closed', '#0A0A0B'],\n      ['--surface-solid', 'rgb(10,10,11)'],\n      ['--surface-frosted', 'rgba(10,10,11,0.86)'],\n      ['--surface-glass', 'rgba(10,10,11,0.72)'],\n      ['--surface', surface],\n      ['--edge', edge],\n      ['--card', solid ? 'rgba(255,255,255,0.045)' : 'rgba(255,255,255,0.06)'],\n      ['--card-hi', 'rgba(255,255,255,0.09)'],\n      ['--line', solid ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.08)'],\n      ['--text-1', '#F4F4F5'],\n      ['--text-2', 'rgba(244,244,245,0.62)'],\n      ['--text-3', 'rgba(244,244,245,0.40)'],\n      ['--track', 'rgba(255,255,255,0.16)'],\n      ['--btn-bg', '#F4F4F5'],\n      ['--focus', '#FB7185'],\n      ['--battery', '#4ADE80'],\n      ['--battery-low', '#FB7185'],\n      ['--brightness', '#FACC15'],\n      ['--ring-track', 'rgba(255,255,255,0.28)']\n    ];\n    const tokens = tokenList.map(([n, v]) => n + ': ' + v).join('; ') + ';';\n    const tokenRows = tokenList.map(([n, v]) => ({ n, v, sw: 'var(' + n + ')' })).concat([\n      { n: 'açık çentik', v: '620×352 (tuval 640×364)', sw: 'transparent' },\n      { n: 'kart', v: '380×72, radius 26', sw: 'transparent' },\n      { n: 'HUD', v: '260×40', sw: 'transparent' },\n      { n: 'yüzen ada üst 1 0 7', left: '', bar: true, bv: '42%', bc: '#F4F4F5', right: '42' }),\n      st({ t: 'Parlaklık göstergesi', n: '260×40, 1,5 sn. Çubuk sarı #FACC15.', w: 260, h: 40, icon: true, ic: '#FACC15', d: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2', left: '', bar: true, bv: '64%', bc: '#FACC15', right: '64' }),\n      st({ t: 'Kısa bildirim', n: '\"Pomodoro bitti\", \"Şarj tamamlandı\" gibi. Opak kalır, okunurluk önce.', w: 300, h: 40, icon: true, ic: '#FB7185', d: 'M12 8v5l3 2M12 22a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', left: 'Pomodoro bitti', right: 'Mola 5 dk', rc: '#A1A1AA' }),\n      st({ t: 'Wi-Fi bağlandı', n: 'Bağlantı değişince kısa Peek. Simge beyaz, metin ikincil.', w: 300, h: 34, icon: true, d: wifi, left: 'Ev Ağı', right: 'Bağlandı', rc: '#A1A1AA' })\n    ];\n\n    // B. Yüzen ada ve ekrana yapışık: yan yana\n    const mkCol = (floating) => {\n      const top = floating ? 9 : 0;\n      const open = Object.assign({ bt: btFor(floating, 'var(--edge)') }, shape(floating, 352, 30));\n      return {\n        t: floating ? 'Yüzen ada' : 'Ekrana yapışık (mevcut)',\n        n: floating ? 'kulaksız, üstten 9 px' : 'kulaklı, üst kenara bitişik',\n        top, ears: !floating,\n        rows: [\n          Object.assign({ l: 'Kapalı · 236×34', w: 236, h: 34, isClosed: true, cellH: 34 + top + 14 }, shape(floating, 34, closedR(34, floating))),\n          Object.assign({ l: 'Peek · 300×34', w: 300, h: 34, isPeek: true, cellH: 34 + top + 14 }, shape(floating, 34, closedR(34, floating))),\n          Object.assign({ l: 'OSD HUD · 260×40', w: 260, h: 40, isHud: true, cellH: 40 + top + 14 }, shape(floating, 40, closedR(40, floating))),\n          Object.assign({ l: 'Açık · 620×352 (yarı ölçek)', isOpen: true, halfTop: top / 2, cellH: 176 + top / 2 + 14 }, open)\n        ]\n      };\n    };\n    const cols = [mkCol(false), mkCol(true)];\n\n    // C. Boşta: halka pil ve gün/saat\n    const circ = 2 * Math.PI * 7.25;\n    const ring = (pct) => (pct / 100 * circ).toFixed(2);\n    const idleBase = Object.assign({ hasRight: true, hasRing: false, isOld: false, beside: true, inside: false, bolt: false, radios: false, rs: 18, rc: '#4ADE80', rw: 600, right2: '', just: 'space-between' }, shape(fl, 34, closedR(34, fl)));\n    const idle = (o) => Object.assign({}, idleBase, { w: 236, h: 34 }, o);\n    const idles = [\n      idle({ t: 'Mevcut: saat ve pil', n: 'Mod 0. Solda saat, sağda yüzde ve pil kutusu.', isOld: true, hasRight: false }),\n      idle({ t: 'Halka %43', n: 'Solda halka + yüzde, sağda gün ve saat.', hasRing: true, pct: 43, dash: ring(43), right: 'Sal 19:21' }),\n      idle({ t: 'Halka %100', n: 'Tam halka; yüzde \"100\" sığar.', hasRing: true, pct: 100, dash: ring(100), right: 'Sal 19:21' }),\n      idle({ t: 'Şarj oluyor', n: 'Halka aynı, yüzdenin yanında küçük şimşek.', hasRing: true, pct: 43, dash: ring(43), bolt: true, right: 'Sal 19:21' }),\n      idle({ t: 'Pil düşük %12', n: 'Eşik ve renk varsayım: ≤%20 iken --battery-low.', hasRing: true, pct: 12, dash: ring(12), rc: '#FB7185', right: 'Sal 19:21' }),\n      idle({ t: 'Pilsiz masaüstü', n: 'Halka gizli, yalnız gün ve saat ortada.', just: 'center', right: 'Sal 19:21' }),\n      idle({ t: 'Peek (halka modu)', n: 'Halka modunda tarih ve radyo simgeleri Peek\\'te görünür, kapalıyken görünmez.', w: 300, hasRing: true, pct: 43, dash: ring(43), right: 'Sal 19:21', right2: '· 18 Kas', radios: true }),\n      idle({ t: 'Seçenek B: yüzde halkada', n: 'Plan \"halka ortasında yüzde\" diyor; 18 px\\'te okunmaz, bu yüzden 24 px halka ve 8 pt yazı. Karar sahibinde.', hasRing: true, pct: 43, dash: ring(43), rs: 24, beside: false, inside: true, right: 'Sal 19:21' })\n    ];\n\n    // D. Çentik kartı: 2 tür x 3 malzeme\n    const cardShape = Object.assign({ bt: btFor(fl, 'var(--edge)') }, shape(fl, 72, 26));\n    const cardCells = [];\n    ['kati', 'buzlu', 'cam'].forEach((req) => {\n      const eff = effective(req);\n      const cx = contrastAt(alphas[eff]);\n      ['u', 'n'].forEach((kind) => {\n        cardCells.push(Object.assign({\n          isUpdate: kind === 'u', isNote: kind === 'n',\n          t: kind === 'u' ? 'Güncelleme' : 'Bildirim', m: names[req],\n          surf: surfVar[eff], edge: eff === 'kati' ? 'transparent' : 'var(--edge)',\n          circle: 'var(--card-hi)',\n          c1: fmt(cx.c1), c2: fmt(cx.c2),\n          raised: eff !== req, raisedTo: short[eff]\n        }, cardShape));\n      });\n    });\n\n    // E. Açılış geçişi\n    const p = s.p;\n    const pc = Math.max(0, Math.min(1, p));\n    const ps = Math.max(0, Math.min(1.05, p));\n    const trAlpha = 1 - (1 - a) * pc;\n    const trShape = shape(fl, 352, 16 + 14 * pc);\n    const tr = {\n      w: Math.round(236 + (620 - 236) * ps), h: Math.round(34 + (352 - 34) * ps),\n      bg: pc === 0 ? 'var(--notch-closed)' : 'rgba(10,10,11,' + trAlpha.toFixed(3) + ')',\n      bd: 'rgba(255,255,255,' + (0.10 * pc).toFixed(3) + ')',\n      inner: Math.max(0, Math.min(1, (p - 0.55) / 0.45)).toFixed(2),\n      top: trShape.top,\n      bt: btFor(fl, 'rgba(255,255,255,' + (0.10 * pc).toFixed(3) + ')'),\n      rad: fl ? (16 + 14 * pc) + 'px' : '0 0 ' + (16 + 14 * pc) + 'px ' + (16 + 14 * pc) + 'px'\n    };\n\n    const seg = (key, label, opts) => ({\n      l: label,\n      opts: opts.map(([v, l]) => ({\n        l,\n        bg: s[key] === v ? '#F4F4F5' : 'transparent',\n        fg: s[key] === v ? '#0A0A0B' : '#D4D4D8',\n        pick: () => { this.setState({ [key]: v }); }\n      }))\n    });\n\n    return {\n      tokens, wall: wall.bg, states, cols, idles, cardCells, tr, tokenRows,\n      matName: names[matEff] + (matEff !== s.mat ? ' (koruma ile)' : ''),\n      progLabel: 'ilerleme ' + p.toFixed(2).replace('.', ',') + ' · opaklık ' + trAlpha.toFixed(2).replace('.', ','),\n      doOpen: () => this.go(1),\n      doClose: () => this.go(0),\n      doMid: () => this.go(0.4),\n      groups: [\n        seg('mat', 'Malzeme', [['kati', 'Katı'], ['buzlu', 'Buzlu'], ['cam', 'Cam']]),\n        seg('wall', 'Duvar kağıdı', [['renkli', 'Renkli'], ['koyu', 'Koyu'], ['acik', 'Açık'], ['foto', 'Fotoğraf']]),\n        seg('protect', 'Okunabilirlik koruması', [[true, 'Açık'], [false, 'Kapalı']]),\n        seg('style', 'Çentik biçimi', [['yapisik', 'Ekrana yapışık'], ['yuzen', 'Yüzen ada']]),\n        seg('motion', 'Hareket', [['normal', 'Normal'], ['azalt', 'Azalt']])\n      ]\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "CamKoy.dc.html": "<!doctype html>\n<html lang=\"tr\">\n<head>\n<meta charset=\"utf-8\">\n<title>Cam Koy penceresi (taslak)<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\n<\/style>\n<\/helmet>\n<div style=\"{{tokens}} width: 1240px; height: 900px; box-sizing: border-box; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column;\">\n\n  <div style=\"flex-grow: 1; background: {{wallBg}}; display: flex; align-items: center; justify-content: center; position: relative;\">\n\n    <!-- Koy penceresi: 880 px -->\n    <div style=\"width: 880px; height: 660px; background: var(--win); border: 1px solid var(--win-edge); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; color: var(--text-1);\">\n\n      <!-- Başlık çubuğu: ayrı zemin yok, pencereyle aynı yüzey -->\n      <div style=\"height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px;\">\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <span style=\"width: 16px; height: 16px; border-radius: 4px; background: #3B82F6; display: flex; align-items: center; justify-content: center;\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16M7 6c0 3 2 4 5 4s5-1 5-4M4 18h16\"><\/path><\/svg><\/span>\n          <span style=\"font-size: 12px; color: var(--text-2);\">Koy<\/span>\n        <\/div>\n        <div style=\"display: flex; color: var(--text-2);\">\n          <button aria-label=\"Küçült\" style=\"width: 44px; height: 32px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0;\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M0 5h10\" stroke=\"currentColor\" stroke-width=\"1\"><\/path><\/svg><\/button>\n          <button aria-label=\"Pencereyi kapat, Koy çalışmaya devam eder\" style=\"width: 44px; height: 32px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0;\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M0 0l10 10M10 0L0 10\" stroke=\"currentColor\" stroke-width=\"1\"><\/path><\/svg><\/button>\n        <\/div>\n      <\/div>\n\n      <div style=\"flex-grow: 1; display: flex; min-height: 0;\">\n        <!-- Kenar menüsü: kendi zemini yok, pencere camı görünür -->\n        <nav style=\"width: 200px; flex-shrink: 0; padding: 4px 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px;\">\n          <sc-for list=\"{{nav}}\" as=\"n\">\n            <button style=\"height: 36px; border: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 8px; font-family: inherit; font-size: 13.5px; background: {{n.bg}}; color: {{n.fg}}; position: relative; cursor: pointer; text-align: left;\" onClick=\"{{n.pick}}\">\n              <span style=\"position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: {{n.bar}};\"><\/span>\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{n.icon}}\"><\/path><\/svg>\n              {{n.label}}\n            <\/button>\n \"flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;\">\n                    <span style=\"font-size: 13.5px;\">{{r.t}}<\/span>\n                    <sc-if value=\"{{r.d}}\"><span style=\"font-size: 12px; color: var(--text-2); line-height: 1.35;\">{{r.d}}<\/span><\/sc-if>\n                  <\/span>\n\n                  <sc-if value=\"{{r.isToggle}}\">\n                    <button style=\"width: 40px; height: 20px; border-radius: 10px; border: {{r.tBorder}}; background: {{r.tBg}}; position: relative; padding: 0; flex-shrink: 0; cursor: pointer;\" aria-label=\"{{r.t}}\" onClick=\"{{r.pick}}\"><span style=\"position: absolute; top: 3px; left: {{r.knobX}}; width: 12px; height: 12px; border-radius: 6px; background: {{r.knob}};\"><\/span><\/button>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isSeg}}\">\n                    <span style=\"display: flex; gap: 2px; background: var(--seg-bg); border: 1px solid var(--card-line); border-radius: 7px; padding: 2px; flex-shrink: 0;\">\n                      <sc-for list=\"{{r.opts}}\" as=\"o\"><button style=\"height: 26px; padding: 0 11px; border: none; border-radius: 5px; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 12px; font-weight: {{o.w}}; cursor: pointer;\" onClick=\"{{o.pick}}\">{{o.l}}<\/button><\/sc-for>\n                    <\/span>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isSelect}}\">\n                    <span style=\"height: 28px; min-width: 130px; padding: 0 10px; border-radius: 6px; background: var(--seg-bg); border: 1px solid var(--card-line); font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;\">{{r.v}}<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/span>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isButton}}\">\n                    <button style=\"height: 28px; padding: 0 14px; border-radius: 6px; border: 1px solid {{r.bBorder}}; background: {{r.bBg}}; color: {{r.bFg}}; font-family: inherit; font-size: 12px; flex-shrink: 0;\">{{r.v}}<\/button>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isKey}}\">\n                    <span style=\"display: flex; gap: 4px; flex-shrink: 0;\"><sc-for list=\"{{r.keys}}\" as=\"k\"><span style=\"height: 24px; min-width: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 5px; background: var(--seg-bg); border: 1px solid var(--card-line); border-bottom-width: 2px; font-size: 11.5px; display: flex; align-items: center; justify-content: center;\">{{k}}<\/span><\/sc-for><\/span>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isSwatch}}\">\n                    <span style=\"display: flex; gap: 6px; flex-shrink: 0;\"><sc-for list=\"{{swatches}}\" as=\"w\"><span style=\"width: 20px; height: 20px; border-radius: 10px; background: {{w.c}}; box-shadow: {{w.ring}};\"><\/span><\/sc-for><\/span>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isGuard}}\">\n                    <span style=\"display: flex; gap: 8px; flex-shrink: 0;\">\n                      <sc-for list=\"{{guardTiles}}\" as=\"g\">\n                        <span style=\"width: 112px; height: 64px; border-radius: 8px; background: {{wallBg}}; display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n                          <span style=\"width: 96px; height: 48px; border-radius: 6px; background: {{g.surf}}; border: 1px solid {{g.edge}}; display: flex; flex-direction: column; justify-content: center; padding: 0 8px; box-sizing: border-box; color: var(--text-1);\">\n                            <span style=\"font-size: 11px; font-weight: 600;\">{{g.name}}<\/span>\n                            <span style=\"font-size: 10px; color: var(--text-2);\">ikincil {{g.ratio}}<\/span>\n                          <\/span>\n                        <\/span>\n                      <\/sc-for>\n                    <\/span>\n                  <\/sc-if>\n\n                  <sc-if value=\"{{r.isMeter}}\">\n                    <span style=\"width: 220px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; font-size: 11px; color: var(--text-2);\">\n                      <span style=\"position: relative; height: 6px; border-radius: 3px; background: var(--seg-bg);\"><span style=\"display: block; width: 39%; height: 6px; border-radius: 3px; background: #34D399;\"><\/span><span style=\"position: absolute; left: 50%; top: -3px; width: 1px; height: 12px; background: var(--text-2);\"><\/span><\/span>\n                      <span style=\"display: flex; justify-content: space-between;\"><span>118 MB<\/span><span>hedef 150 · sınır 200<\/span><\/span>\n                    <\/span>\n                  <\/sc-if>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n          <\/sc-for>\n        <\/main>\n      <\/div>\n    <\/div>\n\n    <div style=\"position: absolute; left: 20px; bottom: 16px; font-size: 11px; padding: 5px 10px; border-radius: 10px; background: rgba(10,10,11,0.75); color: #D4D4D8;\">{{caption}}<\/div>\n  <\/div>\n\n  <!-- Önizleme denetimi (tasarımın parçası değil) -->\n  <div style=\"height: 96px; flex-shrink: 0; background: #0F0F11; border-top: 1px solid #2E2E33; padding: 0 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-content: center; align-items: center; gap: 6px 24px; font-size: 12px; color: #A1A1AA;\">\n    <sc-for list=\"{{groups}}\" as=\"g\">\n      <span style=\"display: flex; align-items: center; gap: 8px;\">{{g.l}}\n        <span style=\"display: flex; gap: 2px; background: #18181B; border: 1px solid #2E2E33; border-radius: 10px; padding: 2px;\">\n          <sc-for list=\"{{g.opts}}\" as=\"o\"><button style=\"height: 26px; padding: 0 11px; border: none; border-radius: 8px; b efined || p.alpha === '' ? 1 : Number(p.alpha);\n\n    const hslToRgb = (h, s, l) => {\n      const k = (n) => (n + h / 30) % 12;\n      const a = s * Math.min(l, 1 - l);\n      const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));\n      return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];\n    };\n    const hex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase();\n    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };\n    const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);\n    const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };\n\n    // CoverPaletteExtractor kuralları: Card S 0.35-0.55, L 0.14; SubText S 0.60, L 0.80; Spectrum = SubText (alfa 0.75).\n    const mono = cv.s < 0.20;\n    let pal = null;\n    if (!mono) {\n      const cs = Math.max(0.35, Math.min(0.55, cv.s));\n      let l = 0.14;\n      let card = hslToRgb(cv.h, cs, l);\n      while (ratio(card, [244, 244, 245]) < 7 && l > 0.04) { l -= 0.01; card = hslToRgb(cv.h, cs, l); }\n      const sub = hslToRgb(cv.h, 0.60, 0.80);\n      pal = { card, sub };\n    }\n\n    let v = p.variant || 'duz';\n    if (!pal && v !== 'duz') v = 'duz';   // gri kapak: varsayılan nötr tema\n    let bg, border, sub, spectrum, title, note;\n    const veil = 'linear-gradient(180deg, rgba(10,10,11,0.55), rgba(10,10,11,0.85))';\n    if (v === 'ton') {\n      const c = pal.card;\n      bg = 'rgba(' + c.join(',') + ',' + alpha + ')';\n      border = 'var(--line)';\n      sub = hex(pal.sub);\n      spectrum = 'rgba(' + pal.sub.join(',') + ',0.75)';\n      title = 'Albüm rengi';\n      note = 'Card ' + hex(c) + ' · SubText ' + hex(pal.sub) + ' · Spectrum SubText @0.75 · kart zemini malzeme opaklığında (' + alpha + ').';\n    } else if (v === 'kapak') {\n      const c = pal.card;\n      bg = veil + ', g: 0;\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E4E4E7\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16\"><\/path><path d=\"M7 6c0 3 2 4 5 4s5-1 5-4\"><\/path><path d=\"M4 18h16\"><\/path><\/svg>\n    <\/button>\n  <\/div>\n\n  <!-- Açıklama etiketleri -->\n  <div style=\"position: absolute; left: 870px; top: 640px; display: flex; flex-direction: column; gap: 4px; width: 260px;\">\n    <span style=\"font-size: 12px; color: #A1A1AA;\">Ayırıcının sağı: klasörler ve küçültülmüş pencereler<\/span>\n  <\/div>\n  <div style=\"position: absolute; left: 50%; top: 48px; transform: translateX(-50%); font-size: 12px; color: #A1A1AA;\">Saat, ağ ve pil çentikte; dock'ta yalnız uygulamalar<\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"time\":{\"editor\":\"text\",\"default\":\"14:36\"},\"$preview\":{\"width\":1440,\"height\":900}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const run = '#A1A1AA', act = '#60A5FA', none = 'transparent';\n    const apps = [\n      { name: 'Dosyalar', letter: 'D', color: '#EAB308', dot: run, dotW: '6px', bg: 'transparent' },\n      { name: 'Tarayıcı', letter: 'T', color: '#0EA5E9', dot: run, dotW: '6px', bg: 'transparent' },\n      { name: 'Kod', letter: 'K', color: '#6366F1', dot: act, dotW: '16px', bg: 'rgba(255,255,255,0.10)' },\n      { name: 'Müzik', letter: 'M', color: '#22C55E', dot: run, dotW: '6px', bg: 'transparent' },\n      { name: 'Sohbet', letter: 'S', color: '#8B5CF6', dot: none, dotW: '6px', bg: 'transparent' },\n      { name: 'Notlar', letter: 'N', color: '#F97316', dot: none, dotW: '6px', bg: 'transparent' }\n    ];\n    return { time: this.props.time ?? '14:36', apps };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "SagAltMenu.dc.html": "<!doctype html>\n<html lang=\"tr\">\n<head>\n<meta charset=\"utf-8\">\n<title>Sağ alttaki Koy menüsü<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\na{color:#93C5FD}a:hover{color:#BFDBFE}\n<\/style>\n<\/helmet>\n<div style=\"width: 480px; height: 520px; position: relative; overflow: hidden; background: #1F2A36; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #F4F4F5;\">\n\n  <!-- Menü -->\n  <div style=\"position: absolute; right: 16px; bottom: 84px; width: 320px; background: rgba(24,24,27,0.97); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.45);\">\n    <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 2px 4px;\">\n      <span style=\"font-size: 15px; font-weight: 700;\">Koy<\/span>\n      <span style=\"font-size: 12px; color: #A1A1AA;\">2 ekranda çalışıyor<\/span>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;\">\n      <sc-for list=\"{{toggles}}\" as=\"t\" hint-placeholder-count=\"2\">\n        <button onClick=\"{{t.flip}}\" style=\"height: 64px; border: none; border-radius: 12px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 14px;\">\n          <span style=\"font-size: 14px; font-weight: 600;\">{{t.label}}<\/span>\n          <span style=\"font-size: 12px; opacity: 0.8;\">{{t.state}}<\/span>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n\n    <div style=\"display: flex; flex-direction: column;\">\n      <button style=\"height: 40px; border: none; background: transparent; color: #F4F4F5; border-radius: 8px; font-size: 14px; font-family: inherit; text-align: left; padding: 0 10px;\">Koy penceresini aç<\/button>\n      <button style=\"height: 40px; border: none; background: transparent; color: #F4F4F5; border-radius: 8px; font-size: 14px; font-family: inherit; text-align: left; padding: 0 10px;\">1 saat duraklat<\/button>\n      <div style=\"height: 1px; background: #27272A; margin: 6px 0;\"><\/div>\n      <button style=\"height: 40px; border: none; background: transparent; color: #FCA5A5; border-radius: 8px; font-size: 14px; font-family: inherit; text-align: left; padding: 0 10px;\">Koy'dan çık<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- Dock'un sağ ucu: Koy simgesi seçili -->\n  <div style=\"position: absolute; right: 16px; bottom: 10px; height: 60px; background: rgba(24,24,27,0.88); border: 1px solid rgba(255,255,255,0.10); border-radius: 18px; display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box;\">\n    <span style=\"width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;\"><span style=\"width: 34px; height: 34px; border-radius: 9px; background: #F97316;\"><\/span><\/span>\n    <div style=\"width: 1px; height: 32px; background: rgba(255,255,255,0.16); margin: 0 6px;\"><\/div>\n    <button aria-label=\"Koy menüsü\" style=\"width: 40px; height: 48px; border: none; background: rgba(255,255,255,0.12); border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 0;\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F4F4F5\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16\"><\/path><path d=\"M7 6c0 3 2 4 5 4s5-1 5-4\"><\/path><path d=\"M4 18h16\"><\/path><\/svg>\n    <\/button>\n  <\/div>\n\n  <span style=\"position: absolute; left: 20px; top: 20px; width: 200px; font-size: 12px; color: #A1A1AA; line-height: 1.5;\">Dock kapalıysa aynı menü Windows bildirim alanındaki Koy simgesinden açılır.<\/span>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":480,\"height\":520}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { notch: true, dock: true }; }\n  renderVals() {\n    const mk = (key, label) => {\n      const on = this.state[key];\n      return {\n        label,\n        state: on ? 'Açık' : 'Kapalı',\n        bg: on ? '#3B82F6' : '#27272A',\n        fg: on ? '#FFFFFF' : '#D4D4D8',\n        flip: () => this.setState({ [key]: !on })\n      };\n    };\n    return { toggles: [mk('notch', 'Çentik'), mk('dock', 'Dock')] };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n"}};

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) {
    const next = typeof p === 'function' ? p(this.state) : p;
    this.state = Object.assign({}, this.state, next);
    if (this.__rerender) this.__rerender();
  }
  forceUpdate() { if (this.__rerender) this.__rerender(); }
}

const parsed = {};
const styled = new Set();
function parse(file) {
  if (parsed[file]) return parsed[file];
  const doc = new DOMParser().parseFromString(DATA.files[file], 'text/html');
  const xdc = doc.querySelector('x-dc');
  const helmet = xdc.querySelector('helmet');
  if (helmet) helmet.remove();
  const script = doc.querySelector('script[data-dc-script]');
  const Cls = new Function('DCLogic', script.textContent + '\nreturn Component;')(DCLogic);
  return (parsed[file] = { xdc, Cls });
}

const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function resolve(expr, scope) {
  expr = expr.trim();
  if (expr === 'true') return true;
  if (expr === 'false') return false;
  if (expr === 'null') return null;
  if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
  if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
  let v = scope;
  for (const part of expr.split('.')) { if (v == null) return undefined; v = v[part]; }
  return v;
}
function wholeHole(text) {
  const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(text);
  return m ? m[1] : null;
}
function interp(text, scope) {
  return text.replace(HOLE, (_, e) => { const v = resolve(e, scope); return v == null ? '' : String(v); });
}
function camel(s) { return s.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); }

function renderChildren(node, scope, out) {
  for (const child of node.childNodes) {
    const r = renderNode(child, scope);
    if (r) out.append(r);
  }
}

function renderNode(node, scope) {
  if (node.nodeType === 3) return document.createTextNode(interp(node.textContent, scope));
  if (node.nodeType !== 1) return null;
  const tag = node.localName;
  if (tag === 'sc-for') {
    const frag = document.createDocumentFragment();
    const list = resolve(wholeHole(node.getAttribute('list')) || '', scope) || [];
    const as = node.getAttribute('as') || 'item';
    list.forEach((item, i) => renderChildren(node, Object.assign({}, scope, { [as]: item, $index: i }), frag));
    return frag;
  }
  if (tag === 'sc-if') {
    const frag = document.createDocumentFragment();
    const raw = node.getAttribute('value') || '';
    const hole = wholeHole(raw);
    if (hole ? resolve(hole, scope) : raw) renderChildren(node, scope, frag);
    return frag;
  }
  if (tag === 'dc-import') {
    const props = {};
    for (const a of node.attributes) {
      if (a.name === 'name' || a.name.startsWith('hint-')) continue;
      const hole = wholeHole(a.value);
      props[camel(a.name)] = hole ? resolve(hole, scope) : interp(a.value, scope);
    }
    return mount(node.getAttribute('name') + '.dc.html', props);
  }
  const el = document.createElementNS(node.namespaceURI, node.tagName.toLowerCase() === node.tagName ? tag : node.tagName);
  for (const a of node.attributes) {
    const hole = wholeHole(a.value);
    if (a.name.startsWith('on') && hole) {
      const fn = resolve(hole, scope);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
      continue;
    }
    el.setAttribute(a.name, a.value.includes('{{') ? interp(a.value, scope) : a.value);
  }
  renderChildren(node, scope, el);
  return el;
}

function mount(file, props) {
  const { xdc, Cls } = parse(file);
  const inst = new Cls(props || {});
  const host = document.createElement('div');
  host.style.display = 'contents';
  inst.__rerender = () => {
    const vals = inst.renderVals() || {};
    host.replaceChildren();
    renderChildren(xdc, vals, host);
  };
  inst.__rerender();
  return host;
}

const canvas = DATA.canvas;
let page = canvas.pages[0].id;
try { page = localStorage.getItem('koy-design-page') || page; } catch (e) {}

function draw() {
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren();
  for (const p of canvas.pages) {
    const b = document.createElement('button');
    b.className = 'tab' + (p.id === page ? ' on' : '');
    b.textContent = p.name;
    b.onclick = () => { page = p.id; try { localStorage.setItem('koy-design-page', page); } catch (e) {} draw(); window.scrollTo(0, 0); };
    tabs.append(b);
  }

  const main = document.getElementById('main');
  main.replaceChildren();
  const notes = document.createElement('div');
  notes.className = 'notes';
  for (const id of canvas.noteOrder || Object.keys(canvas.notes || {})) {
    const n = canvas.notes[id];
    if (!n || (n.page || canvas.pages[0].id) !== page) continue;
    const d = document.createElement('div');
    d.className = 'note' + (n.kind === 'title1' ? ' title' : '');
    d.textContent = n.text;
    notes.append(d);
  }
  main.append(notes);

  const zoomSel = document.getElementById('zoom').value;
  const avail = Math.max(320, window.innerWidth - 48);
  for (const file of canvas.order) {
    const b = canvas.boards[file];
    if (!b || (b.page || canvas.pages[0].id) !== page) continue;
    const zoom = zoomSel === 'fit' ? Math.min(1, avail / b.w) : Number(zoomSel);
    const wrap = document.createElement('section');
    wrap.className = 'board';
    const h = document.createElement('h2');
    h.textContent = b.title || file;
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.style.width = (b.w * zoom) + 'px';
    frame.style.height = (b.h * zoom) + 'px';
    const inner = document.createElement('div');
    inner.style.width = b.w + 'px';
    inner.style.height = b.h + 'px';
    inner.style.zoom = zoom;
    inner.append(mount(file, {}));
    frame.append(inner);
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = 'source/' + file;
    wrap.append(h, frame, src);
    main.append(wrap);
  }
}
document.getElementById('zoom').onchange = draw;
window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(draw, 150); });
draw();
