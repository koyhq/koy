<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Cam Koy penceresi (taslak)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{tokens}} width: 1240px; height: 900px; box-sizing: border-box; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; background: {{wallBg}}; display: flex; align-items: center; justify-content: center; position: relative;">

    <!-- Koy penceresi: 880 px -->
    <div style="width: 880px; height: 660px; background: var(--win); border: 1px solid var(--win-edge); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; color: var(--text-1);">

      <!-- Başlık çubuğu: ayrı zemin yok, pencereyle aynı yüzey -->
      <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 16px; height: 16px; border-radius: 4px; background: #3B82F6; display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 6c0 3 2 4 5 4s5-1 5-4M4 18h16"></path></svg></span>
          <span style="font-size: 12px; color: var(--text-2);">Koy</span>
        </div>
        <div style="display: flex; color: var(--text-2);">
          <button aria-label="Küçült" style="width: 44px; height: 32px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
          <button aria-label="Pencereyi kapat, Koy çalışmaya devam eder" style="width: 44px; height: 32px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; min-height: 0;">
        <!-- Kenar menüsü: kendi zemini yok, pencere camı görünür -->
        <nav style="width: 200px; flex-shrink: 0; padding: 4px 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px;">
          <sc-for list="{{nav}}" as="n">
            <button style="height: 36px; border: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 8px; font-family: inherit; font-size: 13.5px; background: {{n.bg}}; color: {{n.fg}}; position: relative; cursor: pointer; text-align: left;" onClick="{{n.pick}}">
              <span style="position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: {{n.bar}};"></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
              {{n.label}}
            </button>
          </sc-for>
          <div style="flex-grow: 1;"></div>
          <button style="height: 36px; border: 1px solid var(--line); background: transparent; color: var(--danger); border-radius: 8px; font-size: 13.5px; font-family: inherit; display: flex; align-items: center; gap: 10px; padding: 0 12px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.3 7a8 8 0 1 0 11.4 0"></path></svg>
            Koy'dan çık
          </button>
        </nav>

        <!-- İçerik: hafifçe daha opak bir katman, okunurluk için -->
        <main style="flex-grow: 1; min-width: 0; background: var(--win-content); border-top-left-radius: 12px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 22px 28px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 4px;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 600;">{{title}}</h1>
          <span style="font-size: 13px; color: var(--text-2); padding-bottom: 8px;">{{sub}}</span>

          <sc-for list="{{sections}}" as="sec">
            <span style="font-size: 12px; font-weight: 600; color: var(--text-2); margin: 12px 0 6px; display: flex; align-items: center; gap: 8px;">{{sec.h}}<sc-if value="{{sec.isNew}}"><span style="font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: rgba(59,130,246,0.18); color: var(--accent-text);">Yeni</span></sc-if></span>
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <sc-for list="{{sec.rows}}" as="r">
                <div style="min-height: 46px; border-radius: 8px; background: var(--card); border: 1px solid var(--card-line); padding: 8px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 16px;">
                  <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                    <span style="font-size: 13.5px;">{{r.t}}</span>
                    <sc-if value="{{r.d}}"><span style="font-size: 12px; color: var(--text-2); line-height: 1.35;">{{r.d}}</span></sc-if>
                  </span>

                  <sc-if value="{{r.isToggle}}">
                    <button style="width: 40px; height: 20px; border-radius: 10px; border: {{r.tBorder}}; background: {{r.tBg}}; position: relative; padding: 0; flex-shrink: 0; cursor: pointer;" aria-label="{{r.t}}" onClick="{{r.pick}}"><span style="position: absolute; top: 3px; left: {{r.knobX}}; width: 12px; height: 12px; border-radius: 6px; background: {{r.knob}};"></span></button>
                  </sc-if>

                  <sc-if value="{{r.isSeg}}">
                    <span style="display: flex; gap: 2px; background: var(--seg-bg); border: 1px solid var(--card-line); border-radius: 7px; padding: 2px; flex-shrink: 0;">
                      <sc-for list="{{r.opts}}" as="o"><button style="height: 26px; padding: 0 11px; border: none; border-radius: 5px; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 12px; font-weight: {{o.w}}; cursor: pointer;" onClick="{{o.pick}}">{{o.l}}</button></sc-for>
                    </span>
                  </sc-if>

                  <sc-if value="{{r.isSelect}}">
                    <span style="height: 28px; min-width: 130px; padding: 0 10px; border-radius: 6px; background: var(--seg-bg); border: 1px solid var(--card-line); font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;">{{r.v}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
                  </sc-if>

                  <sc-if value="{{r.isButton}}">
                    <button style="height: 28px; padding: 0 14px; border-radius: 6px; border: 1px solid {{r.bBorder}}; background: {{r.bBg}}; color: {{r.bFg}}; font-family: inherit; font-size: 12px; flex-shrink: 0;">{{r.v}}</button>
                  </sc-if>

                  <sc-if value="{{r.isKey}}">
                    <span style="display: flex; gap: 4px; flex-shrink: 0;"><sc-for list="{{r.keys}}" as="k"><span style="height: 24px; min-width: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 5px; background: var(--seg-bg); border: 1px solid var(--card-line); border-bottom-width: 2px; font-size: 11.5px; display: flex; align-items: center; justify-content: center;">{{k}}</span></sc-for></span>
                  </sc-if>

                  <sc-if value="{{r.isSwatch}}">
                    <span style="display: flex; gap: 6px; flex-shrink: 0;"><sc-for list="{{swatches}}" as="w"><span style="width: 20px; height: 20px; border-radius: 10px; background: {{w.c}}; box-shadow: {{w.ring}};"></span></sc-for></span>
                  </sc-if>

                  <sc-if value="{{r.isGuard}}">
                    <span style="display: flex; gap: 8px; flex-shrink: 0;">
                      <sc-for list="{{guardTiles}}" as="g">
                        <span style="width: 112px; height: 64px; border-radius: 8px; background: {{wallBg}}; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                          <span style="width: 96px; height: 48px; border-radius: 6px; background: {{g.surf}}; border: 1px solid {{g.edge}}; display: flex; flex-direction: column; justify-content: center; padding: 0 8px; box-sizing: border-box; color: var(--text-1);">
                            <span style="font-size: 11px; font-weight: 600;">{{g.name}}</span>
                            <span style="font-size: 10px; color: var(--text-2);">ikincil {{g.ratio}}</span>
                          </span>
                        </span>
                      </sc-for>
                    </span>
                  </sc-if>

                  <sc-if value="{{r.isMeter}}">
                    <span style="width: 220px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; font-size: 11px; color: var(--text-2);">
                      <span style="position: relative; height: 6px; border-radius: 3px; background: var(--seg-bg);"><span style="display: block; width: 39%; height: 6px; border-radius: 3px; background: #34D399;"></span><span style="position: absolute; left: 50%; top: -3px; width: 1px; height: 12px; background: var(--text-2);"></span></span>
                      <span style="display: flex; justify-content: space-between;"><span>118 MB</span><span>hedef 150 · sınır 200</span></span>
                    </span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </main>
      </div>
    </div>

    <div style="position: absolute; left: 20px; bottom: 16px; font-size: 11px; padding: 5px 10px; border-radius: 10px; background: rgba(10,10,11,0.75); color: #D4D4D8;">{{caption}}</div>
  </div>

  <!-- Önizleme denetimi (tasarımın parçası değil) -->
  <div style="height: 96px; flex-shrink: 0; background: #0F0F11; border-top: 1px solid #2E2E33; padding: 0 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-content: center; align-items: center; gap: 6px 24px; font-size: 12px; color: #A1A1AA;">
    <sc-for list="{{groups}}" as="g">
      <span style="display: flex; align-items: center; gap: 8px;">{{g.l}}
        <span style="display: flex; gap: 2px; background: #18181B; border: 1px solid #2E2E33; border-radius: 10px; padding: 2px;">
          <sc-for list="{{g.opts}}" as="o"><button style="height: 26px; padding: 0 11px; border: none; border-radius: 8px; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 12px; cursor: pointer;" onClick="{{o.pick}}">{{o.l}}</button></sc-for>
        </span>
      </span>
    </sc-for>
    <span style="width: 100%; font-size: 11px; color: #71717A;">Sol menüye tıkla. Görünüm sayfasındaki Tema ve Malzeme düğmeleri de önizlemeyi değiştirir. Bulanıklık yok: saydamlık saf alfa.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 'gorunum', theme: 'koyu', material: 'cam', wall: 'renkli', protect: true, notchSame: true };
  }
  renderVals() {
    const s = this.state;
    const dark = s.theme !== 'acik';
    const walls = {
      renkli: { bg: 'radial-gradient(circle at 15% 25%, #F97316 0, transparent 35%), radial-gradient(circle at 80% 18%, #8B5CF6 0, transparent 40%), radial-gradient(circle at 70% 85%, #06B6D4 0, transparent 40%), radial-gradient(circle at 25% 85%, #EC4899 0, transparent 35%), #1E1B4B', avg: [78, 62, 120] },
      koyu: { bg: 'linear-gradient(160deg, #0F172A, #111827 60%, #1F2937)', avg: [24, 30, 44] },
      acik: { bg: 'radial-gradient(circle at 30% 20%, #FDE68A 0, transparent 45%), radial-gradient(circle at 80% 70%, #BFDBFE 0, transparent 50%), #F1F5F9', avg: [236, 240, 246] },
      foto: { bg: 'linear-gradient(180deg, rgba(255,214,170,0.9) 0%, rgba(255,150,110,0.55) 26%, rgba(60,80,130,0) 52%), radial-gradient(ellipse at 18% 108%, #1F2A37 0 34%, transparent 35%), radial-gradient(ellipse at 72% 112%, #2B3544 0 42%, transparent 43%), linear-gradient(180deg, #5B7DB1, #3C5A86 60%, #20344F)', avg: [104, 116, 142] }
    };
    const wall = walls[s.wall];
    const alphas = { kati: 1, buzlu: 0.86, cam: 0.72 };

    // Okunabilirlik koruması: ikincil metin 4,5:1 altına inmeyecek en şeffaf seviye seçilir (Cam, Buzlu, Katı sırası).
    const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
    const ratio = (x, y) => { const a1 = lum(x), b1 = lum(y); return (Math.max(a1, b1) + 0.05) / (Math.min(a1, b1) + 0.05); };
    const blend = (top, bottom, t) => top.map((v, i) => v * t + bottom[i] * (1 - t));
    const baseRgb = dark ? [22, 22, 25] : [243, 243, 245];
    const textRgb = dark ? [244, 244, 245] : [24, 24, 27];
    const t2Alpha = dark ? 0.60 : 0.62;
    const ratio2At = (al) => { const sf = blend(baseRgb, wall.avg, al); return ratio(blend(textRgb, sf, t2Alpha), sf); };
    const fmt = (n) => n.toFixed(1).replace('.', ',') + ':1';
    const order = ['cam', 'buzlu', 'kati'];
    const effective = (req) => {
      if (!s.protect) return req;
      for (const lv of order.slice(order.indexOf(req))) { if (ratio2At(alphas[lv]) >= 4.5) return lv; }
      return 'kati';
    };
    const matEff = effective(s.material);
    const a = alphas[matEff];
    const solid = matEff === 'kati';
    const shortName = { kati: 'Katı', buzlu: 'Buzlu', cam: 'Cam' };
    const winRgba = (al) => 'rgba(' + baseRgb.join(',') + ',' + al + ')';
    const guardTiles = ['kati', 'buzlu', 'cam'].map((req) => {
      const eff = effective(req);
      return {
        name: eff === req ? shortName[req] : shortName[req] + ' → ' + shortName[eff],
        surf: winRgba(alphas[eff]),
        edge: eff === 'kati' ? 'transparent' : (dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)'),
        ratio: fmt(ratio2At(alphas[eff]))
      };
    });
    const accent = '#3B82F6';
    const c = dark ? {
      win: winRgba(a), content: solid ? '#1B1B1F' : 'rgba(30,30,34,0.55)',
      t1: '#F4F4F5', t2: 'rgba(244,244,245,0.60)', line: 'rgba(255,255,255,0.08)',
      card: solid ? '#232327' : 'rgba(255,255,255,0.05)', cardLine: solid ? 'transparent' : 'rgba(255,255,255,0.06)',
      segBg: 'rgba(0,0,0,0.22)', segOn: 'rgba(255,255,255,0.14)', navOn: 'rgba(255,255,255,0.08)',
      danger: '#FCA5A5', accentText: '#93C5FD', off: 'rgba(244,244,245,0.55)'
    } : {
      win: winRgba(a), content: solid ? '#FAFAFA' : 'rgba(255,255,255,0.50)',
      t1: '#18181B', t2: 'rgba(24,24,27,0.62)', line: 'rgba(0,0,0,0.08)',
      card: solid ? '#FFFFFF' : 'rgba(255,255,255,0.62)', cardLine: solid ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.05)',
      segBg: 'rgba(0,0,0,0.05)', segOn: '#FFFFFF', navOn: 'rgba(0,0,0,0.06)',
      danger: '#B91C1C', accentText: '#1D4ED8', off: 'rgba(24,24,27,0.5)'
    };

    const toggle = (t, d, key, onOverride) => {
      const on = onOverride !== undefined ? onOverride : (key ? !!s[key] : true);
      return {
        t, d, isToggle: true,
        tBg: on ? accent : 'transparent',
        tBorder: on ? '1px solid ' + accent : '1px solid ' + c.off,
        knob: on ? '#FFFFFF' : c.off,
        knobX: on ? '23px' : '3px',
        pick: key ? () => this.setState({ [key]: !s[key] }) : () => {}
      };
    };
    const seg = (t, d, opts, key, cur) => ({
      t, d, isSeg: true,
      opts: opts.map(([v, l], i) => {
        const on = key ? s[key] === v : i === (cur || 0);
        return { l, bg: on ? c.segOn : 'transparent', fg: on ? c.t1 : c.t2, w: on ? 600 : 400, pick: key ? () => this.setState({ [key]: v }) : () => {} };
      })
    });
    const select = (t, d, v) => ({ t, d, isSelect: true, v });
    const button = (t, d, v, danger) => ({ t, d, isButton: true, v, bBorder: danger ? 'rgba(239,68,68,0.45)' : c.line, bBg: danger ? 'rgba(239,68,68,0.10)' : c.segBg, bFg: danger ? c.danger : c.t1 });
    const keys = (t, d, k) => ({ t, d, isKey: true, keys: k });

    const pages = {
      genel: ['Genel', 'Başlangıç, dil ve güncellemeler', [
        { h: 'Başlangıç', rows: [toggle('Windows açılınca başlat'), toggle('Windows görev çubuğunu gizle', 'Dock açıkken görev çubuğunun yerini alır.')] },
        { h: 'Dil', rows: [select('Arayüz dili', null, 'Türkçe')] },
        { h: 'Güncellemeler', rows: [toggle('Güncellemeleri otomatik denetle'), seg('Kanal', null, [['k', 'Kararlı'], ['o', 'Önizleme']]), button('Son denetim: bugün 09:12', null, 'Şimdi denetle')] }
      ]],
      centik: ['Çentik', 'Görünürlük, açık paneller ve çentik davranışı', [
        { h: 'Genel', rows: [toggle('Çentik etkin'), seg('Görünürlük', 'Akıllı: üstüne pencere gelince gizlenir.', [['a', 'Sabit'], ['b', 'Akıllı'], ['c', 'Gözetleme']]), toggle('Tam ekranda gizle')] },
        { h: 'Boştayken', rows: [seg('Ne gösterilsin', 'Halka seçeneği: solda halka ve yüzde, sağda "Sal 19:21".', [['a', 'Saat ve pil'], ['b', 'Yalnız saat'], ['c', 'Hiçbiri'], ['d', 'Halka pil ve gün/saat']], null, 3)] },
        { h: 'Biçim', isNew: true, rows: [seg('Çentik biçimi', 'Yüzen ada ekranın üst kenarından 9 px aşağıda durur, kulaksızdır.', [['a', 'Ekrana yapışık'], ['b', 'Yüzen ada']], null, 0), seg('Müzik kartı', 'Albüm rengi: kart zemini ve alt metin kapaktan türetilir; Albüm kapağı: kapak arka plan olur.', [['a', 'Düz'], ['b', 'Albüm rengi'], ['c', 'Albüm kapağı']], null, 1)] },
        { h: 'Paneller', rows: [toggle('Odak'), toggle('Takvim'), toggle('Raf (sürükle-bırak)'), toggle('Pano', 'Pano geçmişi açık olmalı.')] }
      ]],
      dock: ['Dock', 'Biçim, davranış ve simgeler', [
        { h: 'Genel', rows: [toggle('Dock\'u göster'), seg('Biçim', null, [['a', 'Yüzen'], ['b', 'Tam genişlik']]), select('Pencere yaklaşınca', null, 'Yer ayır'), toggle('Tam ekranda gizle')] },
        { h: 'Simgeler', rows: [seg('Simge boyutu', null, [['a', 'Küçük'], ['b', 'Orta'], ['c', 'Büyük']], null, 1), seg('Çalışan göstergesi', null, [['a', 'Nokta'], ['b', 'Çizgi']]), toggle('Büyütme efekti', null, null, false)] }
      ]],
      ekranlar: ['Ekranlar', 'Her ekranın kendi çentiği ve dock\'u', [
        { h: 'Bağlı ekranlar', rows: [toggle('Ekran 1 · çentik', 'Ana ekran, 2560×1440'), toggle('Ekran 1 · dock'), toggle('Ekran 2 · çentik', '1920×1080', null, false)] },
        { h: 'Yeni ekran', rows: [seg('Yeni bağlanan ekranda', null, [['a', 'Çentik ve dock'], ['b', 'Yalnız çentik'], ['c', 'Hiçbiri']])] }
      ]],
      gorunum: ['Görünüm', 'Tema, saydamlık ve hareket', [
        { h: 'Tema', rows: [seg('Tema', null, [['sistem', 'Sistem'], ['koyu', 'Koyu'], ['acik', 'Açık']], 'theme'), { t: 'Vurgu rengi', d: 'Açık anahtar, seçili sekme ve odak halkası.', isSwatch: true }, toggle('Windows vurgu rengini kullan', null, null, false)] },
        { h: 'Saydamlık', isNew: true, rows: [
          seg('Malzeme', 'Katı opak; Buzlu %86; Cam %72. Koy penceresi, açık çentik, dock ve menüler aynı ayarı izler.', [['kati', 'Katı'], ['buzlu', 'Buzlu'], ['cam', 'Cam']], 'material'),
          toggle('Açık çentik malzemeyi izlesin', 'Kapatılırsa açık çentik hep opak kalır; pencere ve dock saydam olabilir.', 'notchSame'),
          toggle('Okunabilirlik koruması', 'Duvar kağıdı açık renkliyse ikincil metin 4,5:1 altına inmesin diye Cam kendiliğinden Buzlu\'ya (gerekirse Katı\'ya) çıkar. Duvar kağıdı değişince bir kez ölçülür.', 'protect'),
          { t: 'Koruma önizlemesi', d: 'Seçili duvar kağıdında üç seviye; ok işareti koruma devreye girdiğini gösterir.', isGuard: true }
        ] },
        { h: 'Biçim ve hareket', rows: [seg('Köşe yuvarlaklığı', null, [['a', 'Az'], ['b', 'Normal'], ['c', 'Çok']], null, 1), seg('Animasyon', null, [['a', 'Sakin'], ['b', 'Normal'], ['c', 'Hızlı'], ['d', 'Kapalı']], null, 1), toggle('Windows\'un "animasyonları azalt" ayarına uy')] }
      ]],
      kisayollar: ['Kısayollar', 'Satıra tıklayıp yeni tuşlara bas', [
        { h: 'Genel kısayollar', rows: [keys('Çentiği aç / kapat', null, ['Ctrl', 'Alt', 'N']), keys('Raf', null, ['Ctrl', 'Alt', 'R']), keys('Dock', null, ['Ctrl', 'Alt', 'D']), keys('Koy menüsü', null, ['Ctrl', 'Alt', 'K']), keys('Arama', null, ['Win', 'Shift', 'Q'])] },
        { h: 'Fare', rows: [seg('Çentikte tekerlek', null, [['a', 'Panel değiştir'], ['b', 'Ses']]), seg('Dock\'ta orta tık', null, [['a', 'Yeni pencere'], ['b', 'Kapat']])] }
      ]],
      performans: ['Performans', 'Bellek ve pil', [
