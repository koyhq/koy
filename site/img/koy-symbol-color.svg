<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-color">
  <title id="title-color">Koy Marka Logosu (Renkli Master)</title>
  <defs>
    <!-- Modern Windows 11 Canlı Akrilik Mavi Gradyanı -->
    <linearGradient id="koy-tile-grad" x1="128" y1="32" x2="128" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="koy-notch-grad" x1="128" y1="32" x2="128" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Dış Squircle Karo (Tile) -->
  <rect x="32" y="32" width="192" height="192" rx="48" fill="url(#koy-tile-grad)"/>

  <!-- Üst Çentik Oyuğu (Notch Girintisi) -->
  <path fill="url(#koy-notch-grad)" d="
    M 88 32
    C 94 44 104 54 116 54
    H 140
    C 152 54 162 44 168 32
    H 88
    Z
  "/>

  <!-- Merkez K Monogramı (Saf Beyaz Glif) -->
  <!-- Dikey gövde -->
  <rect x="76" y="82" width="30" height="108" rx="15" fill="#FFFFFF"/>

  <!-- 45° Tok Kollar -->
  <path fill="#FFFFFF" d="
    M 106 136
    L 148 88
    C 154 82 164 81 170 87
    C 176 93 176 102 170 107
    L 134 143
    L 170 179
    C 176 184 176 193 170 199
    C 164 205 154 204 148 198
    L 106 148
    Z
  "/>
</svg>
