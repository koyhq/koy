name: "Bug Report"
description: "Report a crash, visual bug or unexpected behavior in Koy."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report! Please press **Koy window -> About -> Copy diagnostics** and paste your system information in the field below.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What happened, and what did you expect to happen?"
      placeholder: "e.g. When a fullscreen video is opened on the second display..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce the bug?"
      value: |
        1. Go to the '...' setting
        2. Click '...'
        3. Observe the bug
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      options:
        - "Notch (Panels / OSD)"
        - "Dock (Floating Capsule / Full Width / Preview)"
        - "Multi-Monitor (DPI / Fullscreen)"
        - "Koy Window (Settings / Wizard / System Tray)"
        - "Performance & Memory (CPU)"
        - "Install & Update (Velopack)"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostics"
      description: "Paste the output of 'Copy diagnostics' from the About page here."
      placeholder: |
        Koy v0.1.0
        OS: Microsoft Windows NT 10.0.26200.0
        .NET: 10.0.x
        Private Memory: 45.1 MB
      render: text
    validations:
      required: true
