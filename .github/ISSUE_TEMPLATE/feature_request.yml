name: "Feature Request"
description: "Suggest a new panel, interaction or improvement for Koy."
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **Note:** Koy's core design principle is being **lightweight** (single process, no browser/WebView2, 0% idle CPU, low memory). Please keep this architecture in mind when making your suggestion.

  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      description: "Which use case would this feature make easier?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "How should it look and work?"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Notch & Panels"
        - "Dock & Window Management"
        - "Multi-Monitor"
        - "Settings & Customization"
        - "Performance & Memory"
    validations:
      required: true
