name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Windows 11 / .NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Koy.slnx

      - name: Check vulnerable packages
        run: dotnet list Koy.slnx package --vulnerable --include-transitive

      - name: Build (Release, zero warnings)
        run: dotnet build Koy.slnx --no-restore -c Release -warnaserror

      - name: Run xUnit tests
        run: dotnet test Koy.slnx --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 14

  # Kultur duyarsizligi: ayni testler tr-TR (noktasiz/noktali I, virgul ondalik) ve de-DE altinda da gecmeli.
  # KOY_TEST_CULTURE'i tests/Core.Tests/TestCulture.cs okur.
  test-cultures:
    name: Tests (${{ matrix.culture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        culture: [tr-TR, de-DE]
    env:
      KOY_TEST_CULTURE: ${{ matrix.culture }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Koy.slnx

      - name: Build (Release, zero warnings)
        run: dotnet build Koy.slnx --no-restore -c Release -warnaserror

      - name: Run xUnit tests (${{ matrix.culture }})
        run: dotnet test Koy.slnx --no-build -c Release --verbosity normal

  # Surum PR'inda notlar iki dilde de olmali; "Neler Geldi" uygulamanin diline gore okur.
  changelog-languages:
    name: Release notes in both languages
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CHANGELOG.md and CHANGELOG.tr.md
        shell: pwsh
        run: ./scripts/check-changelogs.ps1

  # Yayin is akisinin paketleme adimlarini (gozcu Native AOT, vpk pack) hicbir sey yuklemeden dener.
  # Bu adimlar yalniz surum aninda kosuyordu; orada bozulurlarsa etiket ve surum sayfasi dosyasiz kalir.
  package-dry-run:
    name: Package dry run (Native AOT watchdog + Velopack)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish App (win-x64)
        run: dotnet publish src/App/Koy.App.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Publish Watchdog (win-x64, Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/Watchdog/Koy.Watchdog.csproj -c Release -r win-x64 -o publish/watchdog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish/watchdog/Koy.Watchdog.exe publish/win-x64/ -Force

      - name: Install Velopack CLI (matches the Velopack package version)
        shell: pwsh
        run: |
          $vpkVersion = & ./scripts/get-velopack-version.ps1
          dotnet tool install -g vpk --version $vpkVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Velopack pack (not uploaded)
        shell: pwsh
        run: |
          vpk pack --packId Koy `
                   --packVersion 0.0.1-ci `
                   --packDir publish/win-x64 `
                   --mainExe Koy.exe `
                   --packTitle "Koy" `
                   --packAuthors "Burhan Şahin" `
                   --icon src/App/Resources/app.ico `
                   --runtime win-x64 `
                   --outputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in 'Koy-win-Setup.exe', 'releases.win.json', 'publish/win-x64/Koy.Watchdog.exe') {
            $path = if ($f.StartsWith('publish/')) { $f } else { "dist/$f" }
            if (-not (Test-Path $path)) { throw "Beklenen dosya yok: $path" }
          }
          Get-ChildItem dist | Format-Table Name, Length
