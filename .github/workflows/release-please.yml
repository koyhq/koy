name: Release Please

# main'e her push'ta: sürüm PR'ını (CHANGELOG + sürüm numarası) açar ya da günceller.
# Sürüm PR'ı birleşince etiketi ve GitHub release'ini oluşturur, ardından paketleme
# (release.yml) aynı iş akışından çağrılır. GITHUB_TOKEN ile atılan etiket başka bir
# iş akışını tetiklemediği için paketleme etiket push'una bağlanamaz.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # Takvim OAuth istemcileri ve imza sertifikası depo gizli anahtarlarında; çağrılan iş akışı onları ancak böyle görür.
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      existing_release: true
