name: Release

# Paketleme ve yayin adimlari. Uc yoldan calisir:
#  1. Elle bir v* etiketi push edilirse (tag push).
#  2. release-please.yml, surum PR'i birlestikten sonra cagirir (workflow_call).
#     GITHUB_TOKEN ile atilan etiket baska is akisini tetiklemedigi icin etiket push'u
#     bu yolda calismaz; paketleme bu cagri ile yapilir.
#  3. Mevcut bir etiketi yeniden paketlemek icin elle (workflow_dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to package (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to package (e.g. v0.1.0)'
        required: true
        type: string
      existing_release:
        description: 'The GitHub release already exists (created by release-please): only attach files, keep its notes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Girdi dogrudan betige gomulmez, ortam degiskeni uzerinden okunur (betik enjeksiyonu onlemi).
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.ref }}

      # Elle atilan etiket ya da workflow_dispatch ile verilen etiket, Directory.Build.props'taki surumle ayni olmali;
      # aksi halde paket etiketten farkli bir surum numarasi tasir. release-please yolunda ikisi zaten esittir.
      - name: Verify tag matches Directory.Build.props version
        shell: pwsh
        run: |
          $tagVersion = $env:TAG_NAME.TrimStart('v')
          $propsVersion = ([xml](Get-Content Directory.Build.props -Raw -Encoding utf8)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $propsVersion) { throw "Directory.Build.props icinde <Version> bulunamadi." }
          if ($tagVersion -ne $propsVersion.Trim()) {
            throw "Etiket surumu ($tagVersion) Directory.Build.props surumu ($($propsVersion.Trim())) ile ayni degil. Once surumu guncelleyin ya da dogru etiketi verin."
          }
          Write-Host "Tag $env:TAG_NAME matches Directory.Build.props version $propsVersion."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore, Build and Test
        run: |
          dotnet restore Koy.slnx
          dotnet build Koy.slnx --no-restore -c Release -warnaserror
          dotnet test Koy.slnx --no-build -c Release

      # Takvim OAuth istemcileri sürüme gömülür (Koy.App.csproj AssemblyMetadata). Gizli anahtar yoksa boş kalır ve
      # kullanıcı Ayarlar'da kendi istemcisini girer. Google masaüstü istemcisinin sırrı Google'ca gizli sayılmaz.
      - name: Publish App (win-x64)
        env:
          KOY_BUILD_GOOGLE_CLIENT_ID: ${{ secrets.KOY_GOOGLE_CLIENT_ID }}
          KOY_BUILD_GOOGLE_CLIENT_SECRET: ${{ secrets.KOY_GOOGLE_CLIENT_SECRET }}
          KOY_BUILD_OUTLOOK_CLIENT_ID: ${{ secrets.KOY_OUTLOOK_CLIENT_ID }}
        run: dotnet publish src/App/Koy.App.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      # Gözcü süreç (Native AOT): görev çubuğunu Koy öldürülünce geri getirir. Yalnız exe Koy'un klasörüne kopyalanır.
      - name: Publish Watchdog (win-x64, Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/Watchdog/Koy.Watchdog.csproj -c Release -r win-x64 -o publish/watchdog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish/watchdog/Koy.Watchdog.exe publish/win-x64/ -Force

      - name: Install Velopack CLI (matches the Velopack package version)
        shell: pwsh
        run: |
          $vpkVersion = & ./scripts/get-velopack-version.ps1
          dotnet tool install -g vpk --version $vpkVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Delta paketi: vpk pack, --outputDir'de önceki sürümün full paketi varsa yalnız farkı taşıyan
      # Koy-<sürüm>-delta.nupkg da üretir; bir önceki sürümden güncelleyen kullanıcı ~79 MB yerine farkı indirir
      # (self-contained runtime değişmediği sürece birkaç MB). Önceki sürüm adıyla seçilir (bu sürümden küçük en yüksek
      # kararlı sürüm): release-please yolunda bu sürümün sayfası paketlemeden önce oluştuğu için "en son sürüm" boş olabilir.
      # Bulunamazsa ya da indirilemezse delta atlanır, full paket her durumda üretilir.
      - name: Download previous release (for delta)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $current = [version]($env:TAG_NAME.TrimStart('v') -replace '-.*$', '')
          $prev = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName' |
            ForEach-Object {
              $v = $null
              if ([version]::TryParse(($_.TrimStart('v') -replace '-.*$', ''), [ref]$v) -and $v -lt $current) {
                [pscustomobject]@{ Tag = $_; Version = $v }
              }
            } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $prev) {
            Write-Host "No earlier stable release; skipping delta."
            exit 0
          }
          gh release download $prev.Tag --repo $env:GITHUB_REPOSITORY --pattern 'Koy-*-full.nupkg' --dir dist
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not download $($prev.Tag); this release ships without a delta package."
            Get-ChildItem dist -File | Remove-Item -Force
            exit 0
          }
          Write-Host "Delta base: $($prev.Tag)"

      # Opsiyonel kod imzalama: SIGNING_CERT_BASE64 tanimliysa PFX dosyasi cozulur; tanimli degilse imzasiz akis surer.
      # Alternatif olarak SignPath Foundation veya Azure Trusted Signing (--azureTrustedSignFile) da eklenebilir.
      - name: Prepare Code Signing Certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host "SIGNING_CERT_BASE64 is not configured; continuing with unsigned release."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "koy-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64.Trim()))
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe not found on runner."
          }
          $signTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Code signing enabled."

      - name: Sign Published Binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PATH: ${{ steps.signing.outputs.cert_path }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $baseArgs = @('sign', '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256', '/f', $env:SIGNING_CERT_PATH)
          if (-not [string]::IsNullOrEmpty($env:SIGNING_CERT_PASSWORD)) {
            $baseArgs += @('/p', $env:SIGNING_CERT_PASSWORD)
          }
          foreach ($exe in @('publish/win-x64/Koy.exe', 'publish/win-x64/Koy.Watchdog.exe')) {
            & signtool.exe @baseArgs $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Velopack Installer & Portable Zip
        id: pack
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_CERT_PATH: ${{ steps.signing.outputs.cert_path }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $ver = $env:TAG_NAME.TrimStart('v')
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          # Bu sürümün CHANGELOG bölümleri paket notu olur; uygulama güncelleme penceresinde yeni sürümün notlarını buradan okur.
          # İki dil tek notta işaretle ayrılır (ChangelogParser.TurkishNotesMarker); uygulama kendi dilini seçer.
          $pattern = '(?ms)^## \[' + [regex]::Escape($ver) + '\].*?(?=^## \[|\z)'
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding utf8), $pattern).Value
          $trSection = [regex]::Match((Get-Content CHANGELOG.tr.md -Raw -Encoding utf8), $pattern).Value
          if ($section -and $trSection) {
            $section = $section.TrimEnd() + "`n`n<!-- koy-notes:tr -->`n`n" + $trSection
          }
          $notesArgs = @()
          if ($section) {
            Set-Content -Path dist/release-notes.md -Value $section -Encoding utf8
            $notesArgs = @('--releaseNotes', 'dist/release-notes.md')
          }

          $vpkSignArgs = @()
          if ($env:SIGNING_ENABLED -eq 'true') {
            $signParamStr = "/fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `"$env:SIGNING_CERT_PATH`""
            if (-not [string]::IsNullOrEmpty($env:SIGNING_CERT_PASSWORD)) {
              $signParamStr += " /p `"$env:SIGNING_CERT_PASSWORD`""
            }
            $vpkSignArgs = @('--signParams', $signParamStr)
          }

          vpk pack --packId Koy `
                   --packVersion $ver `
                   --packDir publish/win-x64 `
                   --mainExe Koy.exe `
                   --packTitle "Koy" `
                   --packAuthors "Burhan Şahin" `
                   --icon src/App/Resources/app.ico `
                   --runtime win-x64 `
                   --outputDir dist `
                   @notesArgs `
                   @vpkSignArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist/release-notes.md -ErrorAction SilentlyContinue

          # Delta tabanı olarak indirilen önceki full paket bu sürüme yüklenmez ve sağlama listesine girmez. vpk onu bu sürümün
          # kayıtlarına da yazar; istemci son 10 GitHub sürümünün releases.win.json'unu birleştirdiği için her sürüm yalnız
          # kendi full ve delta paketini listeler (Velopack belgesi: sürüm başına bir full, bir delta). Aksi halde kayıt, bu
          # sürüme yüklenmemiş bir dosyayı gösterir.
          Get-ChildItem dist -Filter 'Koy-*-full.nupkg' | Where-Object { $_.Name -ne "Koy-$ver-full.nupkg" } | Remove-Item -Force
          $feed = Get-Content dist/releases.win.json -Raw -Encoding utf8 | ConvertFrom-Json
          $feed.Assets = @($feed.Assets | Where-Object { $_.Version -eq $ver })
          $feed | ConvertTo-Json -Depth 10 -Compress | Set-Content dist/releases.win.json -Encoding utf8
          $nameRe = [regex]::Escape("Koy-$ver-")
          (Get-Content dist/RELEASES -Encoding utf8) | Where-Object { $_ -match $nameRe } | Set-Content dist/RELEASES -Encoding utf8
          $delta = Get-ChildItem dist -Filter "Koy-$ver-delta.nupkg" -ErrorAction SilentlyContinue
          if ($delta) {
            Write-Host ("Delta package: {0} ({1:N1} MB)" -f $delta.Name, ($delta.Length / 1MB))
            "has_delta=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_delta=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "dist/Koy-win-Portable.zip" -Force

      - name: Clean Up Signing Certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PATH: ${{ steps.signing.outputs.cert_path }}
        run: |
          if ($env:SIGNING_CERT_PATH -and (Test-Path $env:SIGNING_CERT_PATH)) {
            Remove-Item $env:SIGNING_CERT_PATH -Force
          }

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
          }
          Get-Content dist/SHA256SUMS.txt

      # Delta, onu listeleyen releases.win.json'dan önce yüklenir: arada güncelleyen istemci eksik dosya görmesin.
      - name: Upload Delta Package
        if: steps.pack.outputs.has_delta == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: ${{ !inputs.existing_release }}
          fail_on_unmatched_files: true
          files: dist/Koy-*-delta.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Surum yoksa olusturur (elle etiket), varsa yalniz dosya ekler ve notlara dokunmaz.
      # release-please yolunda notlar CHANGELOG'dan gelir; GitHub'in otomatik notlari eklenmez.
      - name: Upload Release Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: ${{ !inputs.existing_release }}
          fail_on_unmatched_files: true
          files: |
            dist/Koy-win-Setup.exe
            dist/Koy-win-Portable.zip
            dist/Koy-*-full.nupkg
            dist/RELEASES
            dist/releases.win.json
            dist/assets.win.json
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
