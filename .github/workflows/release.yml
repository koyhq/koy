name: Release

# Paketleme ve yayin adimlari. Uc yoldan calisir:
#  1. Elle bir v* etiketi push edilirse (tag push).
#  2. release-please.yml, surum PR'i birlestikten sonra cagirir (workflow_call).
#     GITHUB_TOKEN ile atilan etiket baska is akisini tetiklemedigi icin etiket push'u
#     bu yolda calismaz; paketleme bu cagri ile yapilir.
#  3. Mevcut bir etiketi yeniden paketlemek icin elle (workflow_dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to package (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to package (e.g. v0.1.0)'
        required: true
        type: string
      existing_release:
        description: 'The GitHub release already exists (created by release-please): only attach files, keep its notes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Girdi dogrudan betige gomulmez, ortam degiskeni uzerinden okunur (betik enjeksiyonu onlemi).
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore, Build and Test
        run: |
          dotnet restore Koy.slnx
          dotnet build Koy.slnx --no-restore -c Release -warnaserror
          dotnet test Koy.slnx --no-build -c Release

      - name: Publish App (win-x64)
        run: dotnet publish src/App/Koy.App.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      # Gözcü süreç (Native AOT): görev çubuğunu Koy öldürülünce geri getirir. Yalnız exe Koy'un klasörüne kopyalanır.
      - name: Publish Watchdog (win-x64, Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/Watchdog/Koy.Watchdog.csproj -c Release -r win-x64 -o publish/watchdog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish/watchdog/Koy.Watchdog.exe publish/win-x64/ -Force

      - name: Install Velopack CLI (matches the Velopack package version)
        shell: pwsh
        run: |
          $vpkVersion = & ./scripts/get-velopack-version.ps1
          dotnet tool install -g vpk --version $vpkVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Opsiyonel kod imzalama: SIGNING_CERT_BASE64 tanimliysa PFX dosyasi cozulur; tanimli degilse imzasiz akis surer.
      # Alternatif olarak SignPath Foundation veya Azure Trusted Signing (--azureTrustedSignFile) da eklenebilir.
      - name: Prepare Code Signing Certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host "SIGNING_CERT_BASE64 is not configured; continuing with unsigned release."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "koy-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64.Trim()))
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe not found on runner."
          }
          $signTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Code signing enabled."

      - name: Sign Published Binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PATH: ${{ steps.signing.outputs.cert_path }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $baseArgs = @('sign', '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256', '/f', $env:SIGNING_CERT_PATH)
          if (-not [string]::IsNullOrEmpty($env:SIGNING_CERT_PASSWORD)) {
            $baseArgs += @('/p', $env:SIGNING_CERT_PASSWORD)
          }
          foreach ($exe in @('publish/win-x64/Koy.exe', 'publish/win-x64/Koy.Watchdog.exe')) {
            & signtool.exe @baseArgs $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Velopack Installer & Portable Zip
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_CERT_PATH: ${{ steps.signing.outputs.cert_path }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $ver = $env:TAG_NAME.TrimStart('v')
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          # Bu sürümün CHANGELOG bölümleri paket notu olur; uygulama güncelleme penceresinde yeni sürümün notlarını buradan okur.
          # İki dil tek notta işaretle ayrılır (ChangelogParser.TurkishNotesMarker); uygulama kendi dilini seçer.
          $pattern = '(?ms)^## \[' + [regex]::Escape($ver) + '\].*?(?=^## \[|\z)'
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding utf8), $pattern).Value
          $trSection = [regex]::Match((Get-Content CHANGELOG.tr.md -Raw -Encoding utf8), $pattern).Value
          if ($section -and $trSection) {
            $section = $section.TrimEnd() + "`n`n<!-- koy-notes:tr -->`n`n" + $trSection
          }
          $notesArgs = @()
          if ($section) {
            Set-Content -Path dist/release-notes.md -Value $section -Encoding utf8
            $notesArgs = @('--releaseNotes', 'dist/release-notes.md')
          }

          $vpkSignArgs = @()
          if ($env:SIGNING_ENABLED -eq 'true') {
            $signParamStr = "/fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `"$env:SIGNING_CERT_PATH`""
            if (-not [string]::IsNullOrEmpty($env:SIGNING_CERT_PASSWORD)) {
              $signParamStr += " /p `"$env:SIGNING_CERT_PASSWORD`""
            }
            $vpkSignArgs = @('--signParams', $signParamStr)
          }

          vpk pack --packId Koy `
                   --packVersion $ver `
                   --packDir publish/win-x64 `
                   --mainExe Koy.exe `
                   --packTitle "Koy" `
                   --packAuthors "Burhan Şahin" `
                   --icon src/App/Resources/app.ico `
                   --runtime win-x64 `
                   --outputDir dist `
                   @notesArgs `
                   @vpkSignArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist/release-notes.md -ErrorAction SilentlyContinue

          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "dist/Koy-win-Portable.zip" -Force

      - name: Clean Up Signing Certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PATH: ${{ steps.signing.outputs.cert_path }}
        run: |
          if ($env:SIGNING_CERT_PATH -and (Test-Path $env:SIGNING_CERT_PATH)) {
            Remove-Item $env:SIGNING_CERT_PATH -Force
          }

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
          }
          Get-Content dist/SHA256SUMS.txt

      # Surum yoksa olusturur (elle etiket), varsa yalniz dosya ekler ve notlara dokunmaz.
      # release-please yolunda notlar CHANGELOG'dan gelir; GitHub'in otomatik notlari eklenmez.
      - name: Upload Release Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: ${{ !inputs.existing_release }}
          fail_on_unmatched_files: true
          files: |
            dist/Koy-win-Setup.exe
            dist/Koy-win-Portable.zip
            dist/Koy-*-full.nupkg
            dist/RELEASES
            dist/releases.win.json
            dist/assets.win.json
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
